name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: digestory-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Run tests
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Build gem
        run: gem build digestory.gemspec
      - name: Fresh consumer test
        run: |
          tmpdir=$(mktemp -d)
          gem_file="digestory-$(ruby -Ilib -e 'require "digestory/version"; print Digestory::VERSION').gem"
          gem install --local "$gem_file" --install-dir "$tmpdir/gems" --no-document
          GEM_HOME="$tmpdir/gems" GEM_PATH="$tmpdir/gems" ruby -e 'require "digestory"; abort unless Digestory::VERSION == File.basename(Dir["$GEM_HOME/cache/digestory-*.gem"].first).delete_prefix("digestory-").delete_suffix(".gem")'
