name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102ef17c0f0e0e3e7f8f4d0f5e9e7f3f5bd2ef # v1
        with:
          ruby-version: '4.0'
          bundler-cache: false
      - name: Verify version matches tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(ruby -Ilib -e 'require "digestory/version"; print Digestory::VERSION')
          test "$expected" = "$actual"
      - name: Run tests
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Build gem
        run: gem build digestory.gemspec
      - name: Fresh consumer test
        run: |
          tmpdir=$(mktemp -d)
          gem install --local digestory-0.1.0.gem --install-dir "$tmpdir/gems" --no-document
          GEM_HOME="$tmpdir/gems" GEM_PATH="$tmpdir/gems" ruby -e 'require "digestory"; abort unless Digestory::VERSION == "0.1.0"'
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to RubyGems
        run: gem push digestory-0.1.0.gem

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.gem --generate-notes --verify-tag
